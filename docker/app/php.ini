; MonaFindAuto — PHP settings for the development container.

memory_limit = 512M
max_execution_time = 120

; Listing photos arrive from phones, so allow a generous upload size.
upload_max_filesize = 20M
post_max_size = 25M

; Amounts are integer ngwee and never floats, but keep precision honest anyway.
serialize_precision = -1

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

date.timezone = UTC
